services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Postgres (Supabase) lewat file .env; pakai koneksi pooled port 6543
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi di file .env}
      # wajib: isi di .env, minimal 32 karakter acak (openssl rand -hex 32)
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET wajib diisi di file .env}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      NODE_ENV: production
      # produksi wajib via judge terisolasi, bukan toolchain host
      ENABLE_LOCAL_RUNNER: "false"
      PISTON_URL: ${PISTON_URL:-http://piston:2000/api/v2}
      SEED_ON_START: "true"
    volumes:
      - app-uploads:/app/uploads
    depends_on:
      - piston
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Judge eksekusi kode terisolasi. privileged dibutuhkan Piston untuk sandbox-nya.
  piston:
    image: ghcr.io/engineer-man/piston:latest
    restart: unless-stopped
    privileged: true
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=700

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  app-uploads:
  piston-packages:
