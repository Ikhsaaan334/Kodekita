upstream kodekita_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    # unggah avatar dibatasi 2 MB di aplikasi; beri ruang untuk header
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # aset build Next.js: hash di nama berkas, aman di-cache agresif
    location /_next/static/ {
        proxy_pass http://kodekita_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://kodekita_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # kompilasi pertama di judge bisa lambat
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
